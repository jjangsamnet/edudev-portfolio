<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduDev Portfolio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap');
    body { font-family: 'Noto Sans KR', sans-serif; margin: 0; }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .card-hover:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
    .bg-gradient { background: linear-gradient(to bottom right, #f8fafc, #ffffff, #eff6ff); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const projects = [
      {
        id: 1,
        title: "초등 3학년 연산 게임",
        description: "초등학교 3학년 수학 교육과정에 맞춘 연산 학습 게임입니다. 덧셈, 뺄셈, 곱셈 등 기초 연산을 게임 형식으로 재미있게 학습할 수 있도록 설계했습니다.",
        category: "교육 앱",
        tags: ["HTML/CSS", "JavaScript", "GitHub Pages"],
        demoUrl: "https://jjangsamnet.github.io/math-learning-system/",
        emoji: "🧮",
      },
      {
        id: 2,
        title: "핀보드 (웹보드)",
        description: "메모, 이미지, 링크 등을 자유롭게 핀으로 꽂아 정리할 수 있는 웹 기반 공유 보드입니다. 수업 활동이나 협업 시 아이디어를 시각적으로 정리하는 데 활용할 수 있습니다.",
        category: "업무 도구",
        tags: ["Firebase", "Web App", "실시간 협업"],
        demoUrl: "https://shared-board-57b39.web.app/",
        emoji: "📌",
      },
      {
        id: 3,
        title: "수학연산 배틀게임",
        description: "친구와 실시간으로 수학 연산 대결을 펼칠 수 있는 배틀형 학습 게임입니다. 경쟁을 통해 연산 속도와 정확도를 자연스럽게 높일 수 있습니다.",
        category: "교육 앱",
        tags: ["Firebase", "Web App", "실시간 대전"],
        demoUrl: "https://math-battle-game-2df66.web.app",
        emoji: "⚔️",
      },
      {
        id: 4,
        title: "학급 독서록 작성",
        description: "학생들이 읽은 책의 감상을 기록하고 관리할 수 있는 학급 독서록 프로그램입니다. 독서 습관 형성과 독후 활동을 체계적으로 지원합니다.",
        category: "교육 앱",
        tags: ["Firebase", "Web App", "학급 관리"],
        demoUrl: "https://reading-log-app-98ccd.web.app",
        emoji: "📖",
      },
    ];

    const categories = ["전체", "교육 앱", "업무 도구", "대학원 자료"];

    const categoryColorMap = {
      "교육 앱": { bg: "#dbeafe", text: "#1d4ed8", border: "#bfdbfe" },
      "업무 도구": { bg: "#d1fae5", text: "#047857", border: "#a7f3d0" },
      "대학원 자료": { bg: "#ede9fe", text: "#6d28d9", border: "#ddd6fe" },
    };

    function ProjectCard({ project }) {
      const colors = categoryColorMap[project.category];
      return (
        <div className="card-hover bg-white rounded-2xl overflow-hidden border border-gray-100" style={{ boxShadow: "0 4px 12px rgba(0,0,0,0.04)" }}>
          <div className="p-6 pb-4">
            <div className="flex items-start justify-between mb-3">
              <span style={{ fontSize: "1.875rem" }}>{project.emoji}</span>
              <span style={{ padding: "4px 12px", borderRadius: "9999px", fontSize: "0.75rem", fontWeight: 600, backgroundColor: colors.bg, color: colors.text, border: "1px solid " + colors.border }}>{project.category}</span>
            </div>
            <h3 className="text-lg font-bold text-gray-900 mb-2">{project.title}</h3>
            <p className="text-sm text-gray-500" style={{ lineHeight: 1.7 }}>{project.description}</p>
          </div>
          <div className="px-6 pb-4">
            <div className="flex flex-wrap gap-2">
              {project.tags.map((tag) => (
                <span key={tag} style={{ padding: "4px 10px", backgroundColor: "#f9fafb", color: "#4b5563", borderRadius: "8px", fontSize: "0.75rem", fontWeight: 500, border: "1px solid #f3f4f6" }}>{tag}</span>
              ))}
            </div>
          </div>
          <div className="px-6 pb-6">
            <a href={project.demoUrl} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-2 w-full text-white text-sm font-semibold rounded-xl" style={{ padding: "10px 20px", backgroundColor: "#111827", textDecoration: "none", transition: "background-color 0.2s" }} onMouseOver={(e) => e.currentTarget.style.backgroundColor = "#1f2937"} onMouseOut={(e) => e.currentTarget.style.backgroundColor = "#111827"}>
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M14 3h7m0 0v7m0-7L10 14" /></svg>
              실행하기
            </a>
          </div>
        </div>
      );
    }

    function EmptyCategory({ category }) {
      return (
        <div className="text-center py-16 text-gray-400" style={{ gridColumn: "1 / -1" }}>
          <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.5" style={{ margin: "0 auto 12px", opacity: 0.4 }}><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
          <p className="text-sm font-medium">{category === "전체" ? "아직 등록된 프로젝트가 없습니다" : '"' + category + '" 카테고리에 등록된 프로젝트가 없습니다'}</p>
          <p className="text-xs mt-1">새로운 프로젝트가 곧 추가될 예정입니다</p>
        </div>
      );
    }

    function Portfolio() {
      const [activeCategory, setActiveCategory] = useState("전체");
      const filtered = activeCategory === "전체" ? projects : projects.filter((p) => p.category === activeCategory);
      const uniqueCategories = [...new Set(projects.map((p) => p.category))].length;
      const uniqueTags = [...new Set(projects.flatMap((p) => p.tags))].length;

      return (
        <div className="bg-gradient" style={{ minHeight: "100vh" }}>
          <header className="text-center" style={{ paddingTop: "4rem", paddingBottom: "2.5rem", paddingLeft: "1.5rem", paddingRight: "1.5rem" }}>
            <div className="inline-flex items-center gap-2 rounded-full mb-5" style={{ padding: "6px 16px", backgroundColor: "#eff6ff" }}>
              <span className="animate-pulse" style={{ width: 8, height: 8, backgroundColor: "#3b82f6", borderRadius: "50%", display: "inline-block" }}></span>
              <span style={{ fontSize: "0.75rem", fontWeight: 600, color: "#2563eb", letterSpacing: "0.05em" }}>성장 중인 포트폴리오</span>
            </div>
            <h1 className="text-3xl font-extrabold text-gray-900 mb-2" style={{ letterSpacing: "-0.025em" }}>EduDev Portfolio</h1>
            <p className="text-gray-500 text-sm" style={{ maxWidth: 448, margin: "0 auto" }}>교육 현장에서 필요한 도구를 직접 만들고, 하나씩 쌓아가고 있습니다.</p>
          </header>
          <nav className="flex justify-center px-4 mb-10">
            <div className="inline-flex gap-2 bg-white rounded-2xl" style={{ padding: 6, boxShadow: "0 1px 3px rgba(0,0,0,0.05)", border: "1px solid #f3f4f6" }}>
              {categories.map((cat) => (
                <button key={cat} onClick={() => setActiveCategory(cat)} style={{ padding: "8px 16px", borderRadius: "12px", fontSize: "0.875rem", fontWeight: 600, border: "none", cursor: "pointer", transition: "all 0.2s", backgroundColor: activeCategory === cat ? "#111827" : "transparent", color: activeCategory === cat ? "#ffffff" : "#6b7280", boxShadow: activeCategory === cat ? "0 4px 6px rgba(0,0,0,0.1)" : "none" }} onMouseOver={(e) => { if (activeCategory !== cat) { e.currentTarget.style.backgroundColor = "#f9fafb"; e.currentTarget.style.color = "#111827"; }}} onMouseOut={(e) => { if (activeCategory !== cat) { e.currentTarget.style.backgroundColor = "transparent"; e.currentTarget.style.color = "#6b7280"; }}}>
                  {cat}
                  {cat !== "전체" && <span style={{ marginLeft: 6, fontSize: "0.75rem", opacity: 0.6 }}>{projects.filter((p) => p.category === cat).length}</span>}
                </button>
              ))}
            </div>
          </nav>
          <main style={{ maxWidth: 896, margin: "0 auto", padding: "0 1.5rem 2rem" }}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(340px, 1fr))", gap: "1.5rem" }}>
              {filtered.length > 0 ? filtered.map((project) => <ProjectCard key={project.id} project={project} />) : <EmptyCategory category={activeCategory} />}
            </div>
            <div className="flex justify-center gap-8 text-center" style={{ marginTop: "3rem" }}>
              <div>
                <p className="text-2xl font-bold text-gray-900">{projects.length}</p>
                <p className="text-xs text-gray-400" style={{ marginTop: 2 }}>프로젝트</p>
              </div>
              <div style={{ width: 1, backgroundColor: "#e5e7eb" }}></div>
              <div>
                <p className="text-2xl font-bold text-gray-900">{uniqueCategories}</p>
                <p className="text-xs text-gray-400" style={{ marginTop: 2 }}>카테고리</p>
              </div>
              <div style={{ width: 1, backgroundColor: "#e5e7eb" }}></div>
              <div>
                <p className="text-2xl font-bold text-gray-900">{uniqueTags}</p>
                <p className="text-xs text-gray-400" style={{ marginTop: 2 }}>기술 태그</p>
              </div>
            </div>
          </main>
          <footer className="text-center" style={{ padding: "2rem 0", borderTop: "1px solid #f3f4f6", marginTop: "2rem" }}>
            <p className="text-xs text-gray-400">© 2026 EduDev Portfolio · 교육 현장에서 시작된 개발 여정</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Portfolio />);
  </script>
</body>
</html>
